[package]
name = "fixtag-api"
version = "0.1.0"
edition = "2024"

[lib]
name = "fixtag_api"
path = "src/lib.rs"

[[bin]]
name = "fixtag-api"
path = "bin/main.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
clap = "4.6.7"
clap_derive = "4.6.7"
http = "1.5.0"
jsonwebtoken = "11.1.0"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
sqlx = "0.9.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
tower-http = "0.7.1"
utoipa = "6.0.0"
uuid = { version = "1.27.0", features = ["v4"] }
