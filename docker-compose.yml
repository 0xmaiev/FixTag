services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: fixtag
      POSTGRES_PASSWORD: fixtag
      POSTGRES_DB: fixtag
    ports:
      - "5433:5432"  # 5433 on the host, so it never clashes with a local PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixtag -d fixtag"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
